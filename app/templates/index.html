<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RAG Research Demo</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f5f6f8;
            margin: 0;
            padding: 24px;
            color: #111827;
        }

        .container {
            max-width: 980px;
            margin: auto;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 60px;
            padding: 10px;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #d1d5db;
            resize: vertical;
            box-sizing: border-box;
        }

        button {
            margin-top: 10px;
            padding: 6px 18px;
            font-size: 14px;
            background: #1f2937;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .section {
            margin-top: 24px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 600;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 4px;
            margin-bottom: 10px;
        }

        .answer {
            background: #ffffff;
            padding: 14px;
            border-radius: 4px;
            border: 1px solid #e5e7eb;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .evidence {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-left: 4px solid #2563eb;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .evidence-header {
            font-size: 13px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 6px;
        }

        .evidence pre {
            margin: 0;
            font-size: 13px;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .status {
            font-size: 14px;
            color: #374151;
        }

        .error {
            color: #b91c1c;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>RAG Research Demo</h1>
    <div class="subtitle">
        Answer-aware evidence aggregation · Minimal experimental UI
    </div>

    <textarea id="query" placeholder="Enter your research question..."></textarea>
    <br>
    <button id="runBtn" onclick="ask()">Run Query</button>

    <div id="result"></div>

</div>

<script>
    async function ask() {
        const query = document.getElementById("query").value;
        const btn = document.getElementById("runBtn");
        const resultDiv = document.getElementById("result");

        // ---------- UI: running ----------
        btn.disabled = true;
        btn.innerText = "Running...";
        resultDiv.innerHTML = `
            <div class="section">
                <div class="section-title">Status</div>
                <div class="answer status">⏳ Running RAG pipeline…</div>
            </div>
        `;

        try {
            const res = await fetch("/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query })
            });

            const data = await res.json();

            let html = `
                <div class="section">
                    <div class="section-title">Answer</div>
                    <div class="answer">${data.answer}</div>
                </div>
            `;

            if (data.evidence && data.evidence.length > 0) {
                html += `
                    <div class="section">
                        <div class="section-title">Evidence Chunks</div>
                `;
                data.evidence.forEach(ev => {
                    html += `
                        <div class="evidence">
                            <div class="evidence-header">
                                Rank ${ev.rank} · Score ${ev.score} · Chunk ${ev.chunk_id}
                            </div>
                            <pre>${ev.content}</pre>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            resultDiv.innerHTML = html;

        } catch (err) {
            console.error(err);
            resultDiv.innerHTML = `
                <div class="section">
                    <div class="section-title">Error</div>
                    <div class="answer error">
                        ❌ Request failed. Check backend logs.
                    </div>
                </div>
            `;
        } finally {
            // ---------- UI: restore ----------
            btn.disabled = false;
            btn.innerText = "Run Query";
        }
    }
</script>

</body>
</html>
