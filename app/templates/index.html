<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG 多轮问答</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#667085; --line:#e5e9f0; --brand:#3157d5; --soft:#f4f6fb; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f7f8fb; color:var(--ink); font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
    .app { display:grid; grid-template-rows:auto 1fr; width:min(1100px,100%); min-height:100vh; margin:auto; background:#fff; border-inline:1px solid var(--line); }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 24px; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:18px; } .sub { color:var(--muted); font-size:12px; }
    button { border:0; border-radius:9px; cursor:pointer; font:inherit; }
    .new-chat { padding:8px 12px; color:#344054; background:var(--soft); }
    .header-actions { display:flex; align-items:center; gap:8px; }
    .workspace { display:grid; grid-template-columns:230px minmax(0,1fr); min-height:0; }
    .sidebar { padding:14px; border-right:1px solid var(--line); background:#fafbfe; }
    .sidebar h2 { margin:0 0 10px; font-size:13px; color:var(--muted); }
    .session { display:block; width:100%; padding:9px 10px; margin-bottom:5px; text-align:left; color:var(--ink); background:transparent; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .session:hover,.session.active { background:#e9edfb; }
    #messages { overflow:auto; padding:28px 24px 170px; }
    .empty { max-width:520px; margin:16vh auto 0; text-align:center; color:var(--muted); }
    .empty strong { display:block; margin-bottom:8px; color:var(--ink); font-size:22px; }
    .message { display:flex; gap:12px; margin:0 auto 22px; max-width:760px; }
    .message.user { justify-content:flex-end; }
    .bubble { max-width:min(680px,88%); padding:11px 14px; border-radius:14px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .user .bubble { color:#fff; background:var(--brand); border-bottom-right-radius:4px; }
    .assistant .bubble { width:100%; padding:0; background:transparent; }
    .answer { white-space:pre-wrap; }
    .thinking { color:var(--muted); } .thinking::after { content:""; animation:dots 1.2s steps(4,end) infinite; }
    @keyframes dots { 0%{content:""} 25%{content:"."} 50%{content:".."} 75%,100%{content:"..."} }
    .turn-meta { margin-top:12px; border:1px solid var(--line); border-radius:10px; background:#fafbfc; }
    details > summary { padding:9px 12px; color:#475467; cursor:pointer; user-select:none; }
    .rewrite { padding:0 12px 10px; color:var(--muted); font-size:13px; }
    .evidence { margin:0 10px 10px; padding:10px 12px; background:#fff; border:1px solid var(--line); border-radius:8px; }
    .evidence-head { display:flex; flex-wrap:wrap; gap:8px; color:#344054; font-size:12px; font-weight:600; }
    .evidence-content { margin-top:6px; color:#475467; white-space:pre-wrap; font-size:13px; }
    .composer-wrap { position:fixed; bottom:0; left:50%; width:min(1098px,100%); transform:translateX(-50%); padding:12px 24px 20px 254px; background:linear-gradient(transparent,#fff 20%); }
    .composer { display:flex; align-items:flex-end; gap:10px; padding:10px; border:1px solid #ccd3df; border-radius:14px; background:#fff; box-shadow:0 8px 28px rgba(16,24,40,.1); }
    textarea { flex:1; min-height:44px; max-height:150px; resize:none; border:0; outline:0; padding:10px; color:var(--ink); font:inherit; }
    .send { width:44px; height:44px; flex:0 0 auto; color:#fff; background:var(--brand); font-size:18px; }
    .send:disabled { cursor:not-allowed; background:#aeb9da; }
    .hint { margin-top:5px; text-align:center; color:#98a2b3; font-size:11px; }
    .error { color:#b42318; }
    .auth-panel { width:min(380px,calc(100% - 32px)); margin:10vh auto; }
    .auth-panel h2 { margin-bottom:16px; }
    .auth-panel input { display:block; width:100%; padding:12px; margin:10px 0; border:1px solid var(--line); border-radius:8px; font:inherit; }
    .auth-panel button { padding:10px 14px; margin-right:8px; background:var(--brand); color:white; }
    .auth-panel .secondary { background:var(--soft); color:var(--ink); }
    [hidden] { display:none !important; }
    @media (max-width:640px) { header,#messages { padding-inline:16px; } .workspace { grid-template-columns:1fr; } .sidebar { border-right:0; border-bottom:1px solid var(--line); max-height:130px; overflow:auto; } .composer-wrap { padding-inline:12px; } .bubble { max-width:94%; } }
  </style>
</head>
<body>
<main class="app">
  <header>
    <div><h1>RAG 多轮问答</h1><div class="sub">基于上下文连续追问，并展示检索依据</div></div>
    <div class="header-actions"><span id="username" class="sub"></span><button class="new-chat" id="newChat" type="button" hidden>＋ 新对话</button><button class="new-chat" id="logout" type="button" hidden>退出</button></div>
  </header>
  <form class="auth-panel" id="authPanel" hidden>
    <h2>登录后开始问答</h2>
    <input id="authUsername" autocomplete="username" placeholder="用户名（英文、数字、下划线）" required>
    <input id="authPassword" type="password" autocomplete="current-password" placeholder="密码（至少 12 位）" required>
    <button id="login" type="submit">登录</button><button id="register" class="secondary" type="button">注册</button>
    <div id="authError" class="error" role="alert"></div>
  </form>
  <div class="workspace" id="workspace" hidden>
    <aside class="sidebar"><h2>历史会话</h2><div id="sessions"></div></aside>
    <section id="messages" aria-live="polite"></section>
  </div>
  <div class="composer-wrap" id="composerWrap" hidden>
    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="输入问题，Enter 发送，Shift + Enter 换行" aria-label="问题"></textarea>
      <button class="send" id="send" type="submit" aria-label="发送">↑</button>
    </form>
    <div class="hint">回答由模型生成，请结合检索依据核实关键信息</div>
  </div>
</main>
<script>
  const messages = document.querySelector("#messages");
  const input = document.querySelector("#input");
  const send = document.querySelector("#send");
  let busy = false;
  let sessionId = null;
  let csrfToken = null;
  let history = [];
  localStorage.removeItem("rag-chat-session");
  localStorage.removeItem("rag-chat-history");
  async function api(path, options = {}) {
    const headers = { ...(options.headers || {}) };
    if (csrfToken && options.method && options.method !== "GET") headers["X-CSRF-Token"] = csrfToken;
    const response = await fetch(path, { credentials:"same-origin", ...options, headers });
    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      throw new Error(body.detail || `请求失败（${response.status}）`);
    }
    return response.status === 204 ? null : response.json();
  }
  function showLoggedIn(value) {
    document.querySelector("#authPanel").hidden = value;
    document.querySelector("#workspace").hidden = !value;
    document.querySelector("#composerWrap").hidden = !value;
    document.querySelector("#newChat").hidden = !value;
    document.querySelector("#logout").hidden = !value;
  }
  async function loadSessions() {
    const list = await api("/chat/sessions");
    const container = document.querySelector("#sessions");
    container.replaceChildren();
    list.forEach(item => {
      const button = element("button", `session ${item.id === sessionId ? "active" : ""}`, item.title);
      button.type = "button";
      button.title = item.title;
      button.addEventListener("click", () => openSession(item.id));
      container.append(button);
    });
    return list;
  }
  async function openSession(id) {
    if (busy) return;
    const data = await api(`/chat/sessions/${encodeURIComponent(id)}`);
    sessionId = id;
    history = data.messages;
    render();
    await loadSessions();
    input.focus();
  }
  async function boot() {
    try {
      const user = await api("/auth/me");
      csrfToken = user.csrf_token;
      document.querySelector("#username").textContent = user.username;
      showLoggedIn(true);
      const list = await loadSessions();
      if (list.length) await openSession(list[0].id);
      else render();
    } catch { csrfToken = null; sessionId = null; history = []; showLoggedIn(false); }
  }
  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function renderTurn(turn) {
    const row = element("article", `message ${turn.role}`);
    const bubble = element("div", "bubble");
    if (turn.role === "user") bubble.textContent = turn.content;
    else {
      bubble.append(element("div", turn.error ? "answer error" : "answer", turn.content));
      if (!turn.error && (turn.rewritten_query || turn.evidence?.length)) {
        const details = element("details", "turn-meta");
        const count = turn.evidence?.length || 0;
        details.append(element("summary", "", `检索详情 · ${count} 条依据`));
        if (turn.rewritten_query) details.append(element("div", "rewrite", `检索问题：${turn.rewritten_query}`));
        (turn.evidence || []).forEach(item => {
          const card = element("div", "evidence");
          card.append(element("div", "evidence-head", `#${item.rank}　相关度 ${item.score}　${item.source || "未知来源"}　${item.chunk_id || ""}`));
          card.append(element("div", "evidence-content", item.content));
          details.append(card);
        });
        bubble.append(details);
      }
    }
    row.append(bubble); messages.append(row); return row;
  }
  function render() {
    messages.replaceChildren();
    if (!history.length) {
      const empty = element("div", "empty");
      empty.append(element("strong", "", "从一个问题开始"));
      empty.append("我会记住本次对话的上下文，你可以继续追问“为什么”或“它们有什么区别”。");
      messages.append(empty); return;
    }
    history.forEach(renderTurn); scrollToBottom();
  }
  function scrollToBottom() { requestAnimationFrame(() => messages.scrollTo({ top:messages.scrollHeight, behavior:"smooth" })); }
  function setBusy(value) { busy = value; send.disabled = value; input.disabled = value; }

  document.querySelector("#composer").addEventListener("submit", async event => {
    event.preventDefault();
    const question = input.value.trim();
    if (!question || busy) return;
    input.value = ""; input.style.height = "auto";
    history.push({ role:"user", content:question }); render();
    const pending = renderTurn({ role:"assistant", content:"正在思考" });
    pending.querySelector(".answer").classList.add("thinking"); scrollToBottom(); setBusy(true);
    try {
      if (!sessionId) sessionId = (await api("/chat/sessions", { method:"POST" })).id;
      const data = await api(`/chat/sessions/${encodeURIComponent(sessionId)}/messages`, {
        method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ message:question })
      });
      history.push({ role:"assistant", content:data.answer, rewritten_query:data.rewritten_query, evidence:data.evidence || [] });
      render(); await loadSessions();
    } catch (error) {
      history.push({ role:"assistant", content:`暂时无法获取回答：${error.message}`, error:true });
      render();
    } finally { setBusy(false); input.focus(); }
  });
  input.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); document.querySelector("#composer").requestSubmit(); }
  });
  input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = `${Math.min(input.scrollHeight,150)}px`; });
  document.querySelector("#newChat").addEventListener("click", async () => {
    if (busy) return;
    try { const created = await api("/chat/sessions", { method:"POST" }); await openSession(created.id); }
    catch (error) { alert(error.message); }
  });
  document.querySelector("#authPanel").addEventListener("submit", async event => {
    event.preventDefault();
    const username = document.querySelector("#authUsername").value;
    const password = document.querySelector("#authPassword").value;
    try {
      const user = await api("/auth/login", { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ username, password }) });
      csrfToken = user.csrf_token;
      document.querySelector("#authPassword").value = "";
      document.querySelector("#authError").textContent = "";
      await boot();
    } catch (error) { document.querySelector("#authError").textContent = error.message; }
  });
  document.querySelector("#register").addEventListener("click", async () => {
    const username = document.querySelector("#authUsername").value;
    const password = document.querySelector("#authPassword").value;
    try {
      await api("/auth/register", { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ username, password }) });
      document.querySelector("#authPanel").requestSubmit();
    } catch (error) { document.querySelector("#authError").textContent = error.message; }
  });
  document.querySelector("#logout").addEventListener("click", async () => {
    try { await api("/auth/logout", { method:"POST" }); } catch { /* clear client state */ }
    csrfToken = null; sessionId = null; history = []; messages.replaceChildren();
    document.querySelector("#username").textContent = "";
    document.querySelector("#sessions").replaceChildren();
    showLoggedIn(false);
  });
  boot();
</script>
</body>
</html>
