<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG 多轮问答</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#667085; --line:#e5e9f0; --brand:#3157d5; --soft:#f4f6fb; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f7f8fb; color:var(--ink); font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
    .app { display:grid; grid-template-rows:auto 1fr; width:min(1100px,100%); min-height:100vh; margin:auto; background:#fff; border-inline:1px solid var(--line); }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 24px; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:18px; } .sub { color:var(--muted); font-size:12px; }
    button { border:0; border-radius:9px; cursor:pointer; font:inherit; }
    .new-chat { padding:8px 12px; color:#344054; background:var(--soft); }
    .header-actions { display:flex; align-items:center; gap:8px; }
    .workspace { display:grid; grid-template-columns:260px minmax(0,1fr); min-height:0; }
    .sidebar { padding:14px; border-right:1px solid var(--line); background:#fafbfe; overflow-y:auto; max-height:calc(100vh - 78px); }
    .sidebar h2 { margin:0 0 10px; font-size:13px; color:var(--muted); }
    .knowledge-panel { padding-bottom:16px; margin-bottom:16px; border-bottom:1px solid var(--line); }
    .knowledge-panel select,.knowledge-panel input[type="text"] { width:100%; min-width:0; padding:8px; margin:0 0 8px; border:1px solid #ccd3df; border-radius:8px; background:white; font:inherit; }
    .knowledge-panel form { margin:10px 0; }
    .knowledge-panel input[type="file"] { width:100%; margin:4px 0 8px; font:inherit; font-size:12px; }
    .knowledge-panel button { padding:7px 10px; background:#e9edfb; color:#243d9b; }
    .knowledge-panel button:disabled { opacity:.55; cursor:not-allowed; }
    .doc-item { padding:7px 0; border-top:1px solid var(--line); font-size:12px; overflow-wrap:anywhere; }
    .doc-item button { margin-left:6px; padding:3px 6px; font-size:11px; }
    .status { color:var(--muted); font-size:12px; }
    .status.error { color:#b42318; }
    .scope { padding:8px 24px; border-bottom:1px solid var(--line); color:var(--muted); font-size:12px; }
    .session { display:block; width:100%; padding:9px 10px; margin-bottom:5px; text-align:left; color:var(--ink); background:transparent; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .session:hover,.session.active { background:#e9edfb; }
    .chat-area { display:flex; flex-direction:column; min-width:0; min-height:0; }
    #messages { flex:1; overflow:auto; padding:28px 24px 170px; }
    .empty { max-width:520px; margin:16vh auto 0; text-align:center; color:var(--muted); }
    .empty strong { display:block; margin-bottom:8px; color:var(--ink); font-size:22px; }
    .message { display:flex; gap:12px; margin:0 auto 22px; max-width:760px; }
    .message.user { justify-content:flex-end; }
    .bubble { max-width:min(680px,88%); padding:11px 14px; border-radius:14px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .user .bubble { color:#fff; background:var(--brand); border-bottom-right-radius:4px; }
    .assistant .bubble { width:100%; padding:0; background:transparent; }
    .answer { white-space:pre-wrap; }
    .thinking { color:var(--muted); } .thinking::after { content:""; animation:dots 1.2s steps(4,end) infinite; }
    @keyframes dots { 0%{content:""} 25%{content:"."} 50%{content:".."} 75%,100%{content:"..."} }
    .turn-meta { margin-top:12px; border:1px solid var(--line); border-radius:10px; background:#fafbfc; }
    details > summary { padding:9px 12px; color:#475467; cursor:pointer; user-select:none; }
    .rewrite { padding:0 12px 10px; color:var(--muted); font-size:13px; }
    .evidence { margin:0 10px 10px; padding:10px 12px; background:#fff; border:1px solid var(--line); border-radius:8px; }
    .evidence-head { display:flex; flex-wrap:wrap; gap:8px; color:#344054; font-size:12px; font-weight:600; }
    .evidence-content { margin-top:6px; color:#475467; white-space:pre-wrap; font-size:13px; }
    .web-mode { margin:0 0 8px; padding:6px 11px; border:1px solid #ccd3df; color:#344054; background:#fff; font-size:12px; }
    .web-mode.active { border-color:var(--brand); color:#fff; background:var(--brand); }
    .web-mode:disabled { opacity:.55; cursor:not-allowed; }
    .web-source { color:var(--brand); font-weight:600; }
    .web-label { margin-bottom:6px; color:#3157d5; font-size:12px; font-weight:600; }
    .composer-wrap { position:fixed; bottom:0; left:50%; width:min(1098px,100%); transform:translateX(-50%); padding:12px 24px 20px 284px; background:linear-gradient(transparent,#fff 20%); }
    .composer { display:flex; align-items:flex-end; gap:10px; padding:10px; border:1px solid #ccd3df; border-radius:14px; background:#fff; box-shadow:0 8px 28px rgba(16,24,40,.1); }
    textarea { flex:1; min-height:44px; max-height:150px; resize:none; border:0; outline:0; padding:10px; color:var(--ink); font:inherit; }
    .send { width:44px; height:44px; flex:0 0 auto; color:#fff; background:var(--brand); font-size:18px; }
    .send:disabled { cursor:not-allowed; background:#aeb9da; }
    .hint { margin-top:5px; text-align:center; color:#98a2b3; font-size:11px; }
    .error { color:#b42318; }
    .auth-panel { width:min(380px,calc(100% - 32px)); margin:10vh auto; }
    .auth-panel h2 { margin-bottom:16px; }
    .auth-panel input { display:block; width:100%; padding:12px; margin:10px 0; border:1px solid var(--line); border-radius:8px; font:inherit; }
    .auth-panel button { padding:10px 14px; margin-right:8px; background:var(--brand); color:white; }
    .auth-panel .secondary { background:var(--soft); color:var(--ink); }
    [hidden] { display:none !important; }
    @media (max-width:640px) { header,#messages { padding-inline:16px; } .workspace { grid-template-columns:1fr; } .sidebar { border-right:0; border-bottom:1px solid var(--line); max-height:230px; overflow:auto; } .composer-wrap { padding-inline:12px; } .bubble { max-width:94%; } }
  </style>
</head>
<body>
<main class="app">
  <header>
    <div><h1>RAG 多轮问答</h1><div class="sub">基于上下文连续追问，并展示检索依据</div></div>
    <div class="header-actions"><span id="username" class="sub"></span><button class="new-chat" id="newChat" type="button" hidden>＋ 新对话</button><button class="new-chat" id="logout" type="button" hidden>退出</button></div>
  </header>
  <form class="auth-panel" id="authPanel" hidden>
    <h2>登录后开始问答</h2>
    <input id="authUsername" autocomplete="username" placeholder="用户名（英文、数字、下划线）" required>
    <input id="authPassword" type="password" autocomplete="current-password" placeholder="密码（至少 12 位）" required>
    <button id="login" type="submit">登录</button><button id="register" class="secondary" type="button">注册</button>
    <div id="authError" class="error" role="alert"></div>
  </form>
  <div class="workspace" id="workspace" hidden>
    <aside class="sidebar">
      <div class="knowledge-panel">
        <h2>我的知识库</h2>
        <select id="knowledgeBase" aria-label="当前知识库"><option value="">请选择知识库</option></select>
        <form id="createKnowledgeBase">
          <input id="knowledgeBaseName" type="text" maxlength="128" placeholder="新知识库名称" aria-label="新知识库名称" required>
          <button type="submit">创建知识库</button>
        </form>
        <form id="uploadDocument">
          <label for="documentFile">上传资料（.md / .txt / .pdf，最大 10 MiB）</label>
          <input id="documentFile" type="file" accept=".md,.txt,.pdf" required>
          <button id="uploadButton" type="submit">上传文件并建立索引</button>
        </form>
        <div id="knowledgeStatus" class="status" role="status"></div>
        <div id="documents"></div>
      </div>
      <h2>历史会话</h2><div id="sessions"></div>
    </aside>
    <div class="chat-area"><div id="chatScope" class="scope"></div><section id="messages" aria-live="polite"></section></div>
  </div>
  <div class="composer-wrap" id="composerWrap" hidden>
    <button class="web-mode" id="webMode" type="button" aria-pressed="false">🌐 联网搜索：关闭</button>
    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="输入问题，Enter 发送，Shift + Enter 换行" aria-label="问题"></textarea>
      <button class="send" id="send" type="submit" aria-label="发送">↑</button>
    </form>
    <div class="hint" id="composerHint">回答由模型生成，请结合检索依据核实关键信息</div>
  </div>
</main>
<script>
  const messages = document.querySelector("#messages");
  const input = document.querySelector("#input");
  const send = document.querySelector("#send");
  const webMode = document.querySelector("#webMode");
  let busy = false;
  let uploading = false;
  let webEnabled = false;
  let sessionId = null;
  let sessionScope = null;
  let sessionType = "knowledge";
  let legacyReady = false;
  let currentKbId = null;
  let knowledgeBases = [];
  let documents = [];
  let csrfToken = null;
  let history = [];
  localStorage.removeItem("rag-chat-session");
  localStorage.removeItem("rag-chat-history");
  async function api(path, options = {}) {
    const headers = { ...(options.headers || {}) };
    if (csrfToken && options.method && options.method !== "GET") headers["X-CSRF-Token"] = csrfToken;
    const response = await fetch(path, { credentials:"same-origin", ...options, headers });
    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      throw new Error(body.detail || `请求失败（${response.status}）`);
    }
    return response.status === 204 ? null : response.json();
  }
  function showLoggedIn(value) {
    document.querySelector("#authPanel").hidden = value;
    document.querySelector("#workspace").hidden = !value;
    document.querySelector("#composerWrap").hidden = !value;
    document.querySelector("#newChat").hidden = !value;
    document.querySelector("#logout").hidden = !value;
  }
  function knowledgeName(id) {
    return knowledgeBases.find(item => item.id === id)?.name || "已删除的知识库";
  }
  function setKnowledgeStatus(message, error = false) {
    const target = document.querySelector("#knowledgeStatus");
    target.textContent = message;
    target.classList.toggle("error", error);
  }
  function canAsk() {
    if (webEnabled) return true;
    if (sessionId && sessionType === "web") return false;
    return sessionId && sessionScope === null
      ? legacyReady  // 迁移前的全库会话
      : Boolean(currentKbId && documents.some(item => item.status === "ready"));
  }
  function updateComposer() {
    webMode.classList.toggle("active", webEnabled);
    webMode.setAttribute("aria-pressed", String(webEnabled));
    webMode.textContent = webEnabled ? "🌐 联网搜索：开启" : "🌐 联网搜索：关闭";
    webMode.disabled = busy || uploading;
    const available = canAsk();
    input.disabled = busy || uploading || !available;
    send.disabled = busy || uploading || !available;
    document.querySelector("#composerHint").textContent = webEnabled
      ? "仅发送当前问题进行联网搜索，回答会显示网页来源"
      : sessionId && sessionType === "web"
      ? "此会话只支持联网搜索，请点亮上方按钮"
      : !currentKbId && !sessionId
      ? "请选择知识库并上传资料，或开启联网搜索"
      : sessionId && sessionScope === null && !legacyReady
      ? "旧会话没有可检索资料，可开启联网搜索"
      : !available ? "当前知识库没有已索引文档：上传资料、重试索引，或开启联网搜索"
      : "回答由模型生成，请结合检索依据核实关键信息";
    input.placeholder = webEnabled ? "输入联网问题，Enter 发送" : available
      ? "输入问题，Enter 发送，Shift + Enter 换行" : "上传资料或开启联网搜索后即可提问";
  }
  async function loadKnowledgeBases(preferredId = currentKbId) {
    knowledgeBases = await api("/knowledge-bases");
    const select = document.querySelector("#knowledgeBase");
    select.replaceChildren(new Option("请选择知识库", ""));
    knowledgeBases.forEach(item => select.add(new Option(item.name, item.id)));
    currentKbId = knowledgeBases.some(item => item.id === preferredId)
      ? preferredId : (knowledgeBases[0]?.id || null);
    select.value = currentKbId || "";
    await loadDocuments();
  }
  async function loadDocuments() {
    documents = currentKbId
      ? await api(`/knowledge-bases/${encodeURIComponent(currentKbId)}/documents`) : [];
    const container = document.querySelector("#documents");
    container.replaceChildren();
    if (!currentKbId && sessionId && sessionScope === null && sessionType === "knowledge")
      setKnowledgeStatus("旧会话按本人全部已索引资料检索；选择知识库可开启新对话。", false);
    else if (!currentKbId) setKnowledgeStatus("可创建知识库上传资料，或开启联网搜索。", false);
    else if (!documents.length) setKnowledgeStatus("此知识库暂无文件，请先上传。", false);
    else if (!document.querySelector("#knowledgeStatus").classList.contains("error"))
      setKnowledgeStatus(`${documents.filter(item => item.status === "ready").length} 份文件已建立索引。`, false);
    documents.forEach(item => {
      const row = element("div", "doc-item");
      const labels = { ready:"已索引", failed:"索引失败", pending:"待索引", indexing:"索引中" };
      row.append(element("span", "", `${item.original_name} · ${labels[item.status] || item.status}`));
      if (item.status === "failed") {
        const retry = element("button", "", "重试索引");
        retry.type = "button";
        retry.addEventListener("click", async () => {
          const kbId = currentKbId;
          retry.disabled = true;
          setKnowledgeStatus("正在重试索引，请稍候……");
          try {
            await api(`/knowledge-bases/${encodeURIComponent(kbId)}/documents/${encodeURIComponent(item.id)}/reindex`, { method:"POST" });
            setKnowledgeStatus("重试成功，文件已可检索。", false);
          } catch (error) { setKnowledgeStatus(error.message, true); }
          finally { await loadDocuments(); }
        });
        row.append(retry);
      }
      container.append(row);
    });
    updateComposer();
  }
  async function loadSessions() {
    const list = await api("/chat/sessions");
    const container = document.querySelector("#sessions");
    container.replaceChildren();
    list.forEach(item => {
      const scope = item.session_type === "web" ? "联网对话"
        : item.knowledge_base_id ? knowledgeName(item.knowledge_base_id) : "旧版全库";
      const button = element("button", `session ${item.id === sessionId ? "active" : ""}`, `${item.title} · ${scope}`);
      button.type = "button";
      button.title = item.title;
      button.addEventListener("click", () => openSession(item.id).catch(
        error => setKnowledgeStatus(error.message, true)
      ));
      container.append(button);
    });
    return list;
  }
  async function openSession(id, preserveWeb = false) {
    if (busy || uploading) return;
    if (!preserveWeb) webEnabled = false;
    const data = await api(`/chat/sessions/${encodeURIComponent(id)}`);
    sessionId = id;
    sessionScope = data.knowledge_base_id;
    sessionType = data.session_type || "knowledge";
    currentKbId = data.knowledge_base_id;
    legacyReady = false;
    if (sessionScope === null && sessionType === "knowledge") {
      const collections = await Promise.all(knowledgeBases.map(item =>
        api(`/knowledge-bases/${encodeURIComponent(item.id)}/documents`)
      ));
      legacyReady = collections.some(list => list.some(doc => doc.status === "ready"));
    }
    document.querySelector("#knowledgeBase").value = currentKbId || "";
    await loadDocuments();
    history = data.messages;
    render();
    await loadSessions();
    input.focus();
  }
  async function boot() {
    let user;
    try {
      user = await api("/auth/me");
    } catch {
      csrfToken = null; sessionId = null; sessionScope = null; sessionType = "knowledge";
      webEnabled = false; legacyReady = false; history = [];
      showLoggedIn(false); return;
    }
    csrfToken = user.csrf_token;
    document.querySelector("#username").textContent = user.username;
    showLoggedIn(true);
    try {
      await loadKnowledgeBases();
      const list = await loadSessions();
      const recentScoped = list.find(item => item.knowledge_base_id &&
        knowledgeBases.some(kb => kb.id === item.knowledge_base_id));
      if (recentScoped) await openSession(recentScoped.id);
      else render();
    } catch (error) { setKnowledgeStatus(error.message, true); render(); }
  }
  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function safeWebUrl(value) {
    try {
      const url = new URL(value);
      return ["https:", "http:"].includes(url.protocol) ? url.href : null;
    } catch { return null; }
  }
  function webLink(url, title) {
    const link = element("a", "web-source", title || url);
    link.href = url; link.target = "_blank"; link.rel = "noopener noreferrer";
    return link;
  }
  function renderWebAnswer(container, answer, citations) {
    const chars = Array.from(answer);
    let offset = 0;
    (citations || []).slice().sort((a,b) => a.start_index - b.start_index).forEach(item => {
      const url = safeWebUrl(item.url);
      const start = item.start_index, end = item.end_index;
      if (!url || !Number.isInteger(start) || !Number.isInteger(end)
          || start < offset || end <= start || end > chars.length) return;
      container.append(document.createTextNode(chars.slice(offset, start).join("")));
      const link = webLink(url, "【查看来源】");
      link.title = item.title || url;
      container.append(link);
      offset = end;
    });
    container.append(document.createTextNode(chars.slice(offset).join("")));
  }
  function renderTurn(turn) {
    const row = element("article", `message ${turn.role}`);
    const bubble = element("div", "bubble");
    if (turn.role === "user") bubble.textContent = turn.content;
    else {
      const isWeb = turn.metadata?.mode === "web";
      if (isWeb) bubble.append(element("div", "web-label", "联网回答 · 网页来源"));
      const answer = element("div", turn.error ? "answer error" : "answer");
      if (isWeb) renderWebAnswer(answer, turn.content, turn.metadata?.citations);
      else answer.textContent = turn.content;
      bubble.append(answer);
      if (!turn.error && (turn.rewritten_query || turn.evidence?.length)) {
        const details = element("details", "turn-meta");
        const count = turn.evidence?.length || 0;
        details.append(element("summary", "", isWeb ? `网页来源 · ${count} 条` : `检索详情 · ${count} 条依据`));
        if (turn.rewritten_query && !isWeb) details.append(element("div", "rewrite", `检索问题：${turn.rewritten_query}`));
        (turn.evidence || []).forEach(item => {
          const card = element("div", "evidence");
          if (item.source_type === "web") {
            const url = safeWebUrl(item.url);
            card.append(url ? webLink(url, `#${item.rank}　${item.title || url}`)
              : element("span", "", "无效网页来源"));
          } else {
            card.append(element("div", "evidence-head", `#${item.rank}　${item.source || "未知来源"}　${item.chunk_id || ""}`));
            card.append(element("div", "evidence-content", item.content));
          }
          details.append(card);
        });
        bubble.append(details);
      }
    }
    row.append(bubble); messages.append(row); return row;
  }
  function render() {
    document.querySelector("#chatScope").textContent = webEnabled
      ? "当前模式：联网搜索（只发送本次问题）"
      : sessionId && sessionType === "web" ? "当前对话：联网专用（请开启联网搜索）"
      : sessionId && sessionScope === null
      ? "当前对话：旧版全库范围（仅本人资料）"
      : currentKbId ? `当前知识库：${knowledgeName(currentKbId)}` : "可选择知识库，或开启联网搜索";
    messages.replaceChildren();
    if (!history.length) {
      const empty = element("div", "empty");
      empty.append(element("strong", "", canAsk() ? "从一个问题开始" : "先上传资料，或开启联网搜索"));
      empty.append(canAsk()
        ? webEnabled ? "仅发送当前问题进行联网搜索，回答会显示网页来源。"
          : sessionId && sessionScope === null
          ? "此旧会话会检索你名下全部已索引资料。"
          : "问题只会检索当前知识库；我会保存这段对话的上下文，方便继续追问。"
        : "选择知识库并上传资料，或点亮输入框上方的联网搜索按钮。");
      messages.append(empty); return;
    }
    history.forEach(renderTurn); scrollToBottom();
  }
  function scrollToBottom() { requestAnimationFrame(() => messages.scrollTo({ top:messages.scrollHeight, behavior:"smooth" })); }
  function setBusy(value) { busy = value; updateComposer(); }

  document.querySelector("#composer").addEventListener("submit", async event => {
    event.preventDefault();
    const question = input.value.trim();
    if (!question || busy || uploading || !canAsk()) return;
    input.value = ""; input.style.height = "auto";
    history.push({ role:"user", content:question }); render();
    const pending = renderTurn({ role:"assistant", content:"正在思考" });
    pending.querySelector(".answer").classList.add("thinking"); scrollToBottom(); setBusy(true);
    try {
      if (!sessionId) {
        const created = await api("/chat/sessions", {
          method:"POST", headers:{ "Content-Type":"application/json" },
          body:JSON.stringify({ knowledge_base_id:currentKbId,
            session_type:currentKbId ? "knowledge" : "web" })
        });
        sessionId = created.id;
        sessionScope = created.knowledge_base_id;
        sessionType = created.session_type;
      }
      const data = await api(`/chat/sessions/${encodeURIComponent(sessionId)}/messages`, {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({ message:question, mode:webEnabled ? "web" : "knowledge" })
      });
      history.push({ role:"assistant", content:data.answer, rewritten_query:data.rewritten_query,
        evidence:data.evidence || [], metadata:data.metadata || {} });
      render(); await loadSessions();
    } catch (error) {
      history.push({ role:"assistant", content:`暂时无法获取回答：${error.message}`, error:true });
      render();
    } finally { setBusy(false); input.focus(); }
  });
  input.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); document.querySelector("#composer").requestSubmit(); }
  });
  input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = `${Math.min(input.scrollHeight,150)}px`; });
  webMode.addEventListener("click", () => {
    if (busy || uploading) return;
    webEnabled = !webEnabled;
    updateComposer(); render(); input.focus();
  });
  document.querySelector("#newChat").addEventListener("click", async () => {
    if (busy || uploading) return;
    if (!currentKbId && !webEnabled) { setKnowledgeStatus("请先选择知识库或开启联网搜索。", true); return; }
    if (currentKbId && !documents.some(item => item.status === "ready") && !webEnabled) {
      setKnowledgeStatus("请先上传文件并完成索引。", true); return;
    }
    try {
      const created = await api("/chat/sessions", {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({ knowledge_base_id:currentKbId,
          session_type:currentKbId ? "knowledge" : "web" })
      });
      await openSession(created.id, true);
    }
    catch (error) { alert(error.message); }
  });
  document.querySelector("#knowledgeBase").addEventListener("change", async event => {
    if (busy || uploading) { event.target.value = currentKbId || ""; return; }
    currentKbId = event.target.value || null;
    webEnabled = false;
    sessionId = null; sessionScope = currentKbId; sessionType = "knowledge";
    legacyReady = false; history = [];
    setKnowledgeStatus("", false);
    try { await loadDocuments(); await loadSessions(); render(); }
    catch (error) { setKnowledgeStatus(error.message, true); }
  });
  document.querySelector("#createKnowledgeBase").addEventListener("submit", async event => {
    event.preventDefault();
    if (busy || uploading) return;
    const name = document.querySelector("#knowledgeBaseName").value.trim();
    if (!name) return;
    try {
      const created = await api("/knowledge-bases", {
        method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ name })
      });
      sessionId = null; sessionScope = created.id; sessionType = "knowledge";
      legacyReady = false; history = [];
      webEnabled = false;
      document.querySelector("#knowledgeBaseName").value = "";
      setKnowledgeStatus("", false);
      await loadKnowledgeBases(created.id);
      await loadSessions(); render();
    } catch (error) { setKnowledgeStatus(error.message, true); }
  });
  document.querySelector("#uploadDocument").addEventListener("submit", async event => {
    event.preventDefault();
    if (busy || uploading) return;
    if (!currentKbId) { setKnowledgeStatus("请先选择知识库。", true); return; }
    const fileInput = document.querySelector("#documentFile");
    const file = fileInput.files[0];
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) { setKnowledgeStatus("文件不能超过 10 MiB。", true); return; }
    const button = document.querySelector("#uploadButton");
    const kbId = currentKbId;
    const form = new FormData(); form.append("file", file);
    uploading = true; button.disabled = true; updateComposer();
    setKnowledgeStatus("正在上传并建立索引，可能需要一段时间……", false);
    try {
      await api(`/knowledge-bases/${encodeURIComponent(kbId)}/documents`, { method:"POST", body:form });
      fileInput.value = "";
      setKnowledgeStatus("上传并建立索引成功，现在可以提问。", false);
    } catch (error) { setKnowledgeStatus(error.message, true); }
    finally {
      uploading = false; button.disabled = false;
      await loadDocuments(); render();
    }
  });
  document.querySelector("#authPanel").addEventListener("submit", async event => {
    event.preventDefault();
    const username = document.querySelector("#authUsername").value;
    const password = document.querySelector("#authPassword").value;
    try {
      const user = await api("/auth/login", { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ username, password }) });
      csrfToken = user.csrf_token;
      document.querySelector("#authPassword").value = "";
      document.querySelector("#authError").textContent = "";
      await boot();
    } catch (error) { document.querySelector("#authError").textContent = error.message; }
  });
  document.querySelector("#register").addEventListener("click", async () => {
    const username = document.querySelector("#authUsername").value;
    const password = document.querySelector("#authPassword").value;
    try {
      await api("/auth/register", { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ username, password }) });
      document.querySelector("#authPanel").requestSubmit();
    } catch (error) { document.querySelector("#authError").textContent = error.message; }
  });
  document.querySelector("#logout").addEventListener("click", async () => {
    try { await api("/auth/logout", { method:"POST" }); } catch { /* clear client state */ }
    csrfToken = null; sessionId = null; sessionScope = null; sessionType = "knowledge";
    legacyReady = false; webEnabled = false;
    currentKbId = null;
    knowledgeBases = []; documents = []; history = []; messages.replaceChildren();
    document.querySelector("#username").textContent = "";
    document.querySelector("#sessions").replaceChildren();
    document.querySelector("#documents").replaceChildren();
    document.querySelector("#knowledgeBase").replaceChildren(new Option("请选择知识库", ""));
    setKnowledgeStatus("", false);
    showLoggedIn(false);
  });
  boot();
</script>
</body>
</html>
